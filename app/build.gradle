plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.drivehub.dort'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.drivehub.dort"
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName "0.9.6"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    flavorDimensions "env"

    productFlavors {
        car {
            dimension "env"
            // Araç için
            applicationId "com.drivehub.dort"
        }
        sim {
            dimension "env"
            // Simülasyon / emulator için ayrı paket
            applicationId "com.drivehub.dort.sim"
        }
    }

    buildTypes {
        debug {
            // Android Studio Run butonu → debug keystore (hızlı geliştirme)
        }
        release {
            // R8 bazen ContentProvider/AndroidX sınıflarını siliyor; crash olursa geçici false kullan
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // Açık bağımlılık: AppCompat üzerinden gelen transitive bazen eksik görünebiliyor;
    // CoreComponentFactory (androidx.core.app) sınıfları APK'da kesin dursun.
    implementation "androidx.core:core:1.13.1"
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation "com.github.PhilJay:MPAndroidChart:v3.1.0"
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}